name: OrangeHRM Playwright Tests

on:
  # Trigger when a PR is merged into main
  push:
    branches:
      - main

  # Trigger when a PR is raised against main (merged only — handled by the job condition below)
  pull_request:
    branches:
      - main
    types:
      - closed

  # Nightly run at midnight UTC
  schedule:
    - cron: "0 0 * * *"

  # Manual trigger from GitHub Actions UI
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to run tests against"
        required: true
        default: "QA"
        type: choice
        options:
          - QA
          - UAT

jobs:
  test:
    name: Run Playwright Tests (${{ github.event.inputs.environment || 'QA' }})
    runs-on: ubuntu-latest

    # For pull_request trigger — only run when PR is actually merged, not just closed
    if: >
      github.event_name != 'pull_request' ||
      github.event.pull_request.merged == true

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── 2. Python setup ───────────────────────────────────────────────────────
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ── 3. Cache pip to speed up subsequent runs ──────────────────────────────
      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # ── 4. Install Python packages ────────────────────────────────────────────
      - name: Install dependencies
        run: pip install -r requirements.txt

      # ── 5. Install Playwright browser ─────────────────────────────────────────
      - name: Install Playwright Chromium
        run: playwright install chromium --with-deps

      # ── 6. Create report directories ─────────────────────────────────────────
      - name: Create report directories
        run: mkdir -p reports/html/assets reports/screenshots runners/reports

      # ── 7. Run tests ──────────────────────────────────────────────────────────
      - name: Run tests
        id: run_tests
        env:
          ENV: ${{ github.event.inputs.environment || 'QA' }}
          HEADLESS: "true"
        run: |
          python -m pytest tests/ \
            --html=reports/html/report.html \
            --self-contained-html \
            -v
        # Don't fail here — let artifact upload and email steps always run
        continue-on-error: true

      # ── 8. Parse test results for email subject ───────────────────────────────
      - name: Parse test results
        if: always()
        id: results
        run: |
          python3 - << 'PYEOF'
          import re, os

          with open("reports/html/report.html", "r") as f:
              content = f.read()

          # pytest-html v4 format: <span class="passed">2 Passed,</span>
          # Number comes BEFORE the capitalised word
          passed  = re.search(r'<span class="passed">\s*(\d+)\s*Passed',  content)
          failed  = re.search(r'<span class="failed">\s*(\d+)\s*Failed',  content)
          skipped = re.search(r'<span class="skipped">\s*(\d+)\s*Skipped', content)

          p = int(passed.group(1))  if passed  else 0
          f = int(failed.group(1))  if failed  else 0
          s = int(skipped.group(1)) if skipped else 0

          status  = "FAILED" if f > 0 else "PASSED"
          summary = f"{p} passed, {f} failed, {s} skipped"

          print(f"Parsed results: {summary} -> {status}")

          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"status={status}\n")
              out.write(f"summary={summary}\n")
          PYEOF

      # ── 9. Zip screenshots for email attachment ──────────────────────────────
      - name: Zip screenshots
        if: always()
        run: |
          cd reports
          if [ "$(ls -A screenshots)" ]; then
            zip -r screenshots.zip screenshots/
          else
            echo "No screenshots found, creating empty zip"
            zip -r screenshots.zip screenshots/
          fi

      # ── 10. Upload HTML report as GitHub artifact ─────────────────────────────
      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-html-report
          path: reports/html/
          retention-days: 14

      # ── 11. Upload screenshots as GitHub artifact ─────────────────────────────
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-screenshots
          path: reports/screenshots/
          retention-days: 14

      # ── 12. Send email with report and screenshots ────────────────────────────
      - name: Send email report
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          to: ${{ secrets.EMAIL_RECIPIENTS }}
          from: GitHub Actions <${{ secrets.EMAIL_USERNAME }}>
          subject: >
            [${{ steps.results.outputs.status }}] OrangeHRM Tests —
            ${{ steps.results.outputs.summary }} —
            ${{ github.event.inputs.environment || 'QA' }} —
            Run #${{ github.run_number }}
          body: |
            OrangeHRM Playwright Test Run Summary
            ======================================

            Status      : ${{ steps.results.outputs.status }}
            Results     : ${{ steps.results.outputs.summary }}
            Environment : ${{ github.event.inputs.environment || 'QA' }}
            Branch      : ${{ github.ref_name }}
            Triggered by: ${{ github.event_name }}
            Run number  : #${{ github.run_number }}
            Workflow    : ${{ github.workflow }}

            View full run:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Attachments
            -----------
            - report.html   → full HTML test report (self-contained)
            - screenshots.zip → all test screenshots (PASS + FAIL)

            This email was sent automatically by GitHub Actions.
          attachments: >
            reports/html/report.html,
            reports/screenshots.zip

      # ── 13. Fail the job if tests failed (after email is sent) ───────────────
      - name: Assert test results
        if: always()
        run: |
          if [ "${{ steps.results.outputs.status }}" = "FAILED" ]; then
            echo "Tests failed — marking job as failed"
            exit 1
          fi
          echo "All tests passed"
